name: Deploy Astro Website

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. install pnpm before setup-node (for automatic pnpm Store cache)
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # 2. Install & Build Dependencies
      - name: Install & Build
        env:
          PIXELARTICONS_KEY: ${{ secrets.PIXELARTICONS_KEY }}
        run: |
          # 1. Packages sauber installieren
          pnpm install --frozen-lockfile

          # 2. Pixelarticons Pro Assets laden / freischalten
          pnpm exec pixelarticons upgrade --key="$PIXELARTICONS_KEY"

          # 3. Astro Projekt bauen
          pnpm build

      # 3. Join Tailscale Mesh
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci-cd

      # 4. Install Incus Client CLI & Configure mTLS Certificates
      - name: Setup Incus Remote
        env:
          INCUS_CERT: ${{ secrets.INCUS_ACTIONS_CERT }}
          INCUS_KEY: ${{ secrets.INCUS_ACTIONS_KEY }}
          INCUS_HOST: ${{ secrets.INCUS_GATEWAY_IP }}
        run: |
          sudo mkdir -p /etc/apt/keyrings
          sudo curl -fsSL https://pkgs.zabbly.com/key.asc -o /etc/apt/keyrings/zabbly.asc
          echo "deb [signed-by=/etc/apt/keyrings/zabbly.asc] https://pkgs.zabbly.com/incus/stable $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/zabbly-incus-stable.list
          sudo apt-get update && sudo apt-get install -y incus-client

          mkdir -p ~/.config/incus
          echo "$INCUS_CERT" > ~/.config/incus/client.crt
          echo "$INCUS_KEY" > ~/.config/incus/client.key
          chmod 600 ~/.config/incus/client.key

          incus remote add production "https://${INCUS_HOST}:8443" --accept-certificate --auth-type tls

      # 5. Atomic Zero-Downtime Deployment via Incus API
      - name: Atomic Deploy into LXC Container
        run: |
          RELEASE_ID=$(date +%Y%m%d%H%M%S)
          RELEASE_DIR="/var/www/astro/releases/$RELEASE_ID"

          echo "🚀 Creating Release Directory: $RELEASE_DIR"
          incus exec production:astro-prod -- mkdir -p "$RELEA