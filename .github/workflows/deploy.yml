name: Deploy Astro Website

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Install pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # 2. Install node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Install dependencies, upgrade Pixelarticons & build
      - name: Install & Build
        env:
          PIXELARTICONS_KEY: ${{ secrets.PIXELARTICONS_KEY }}
        run: |
          pnpm install --frozen-lockfile
          pnpm exec pixelarticons upgrade --key="$PIXELARTICONS_KEY"
          pnpm build

          pnpm --filter=. deploy --prod ./bundle
          cp -r dist ./bundle/dist
          tar -czf release.tar.gz -C ./bundle .

      # 4. Join Tailscale Mesh
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci-cd

      # 5. Setup Incus Remote
      - name: Setup Incus Remote
        env:
          INCUS_CERT: ${{ secrets.INCUS_ACTIONS_CERT }}
          INCUS_KEY: ${{ secrets.INCUS_ACTIONS_KEY }}
          INCUS_HOST: ${{ secrets.INCUS_GATEWAY_IP }}
        run: |
          sudo mkdir -p /etc/apt/keyrings
          sudo curl -fsSL https://pkgs.zabbly.com/key.asc -o /etc/apt/keyrings/zabbly.asc
          echo "deb [signed-by=/etc/apt/keyrings/zabbly.asc] https://pkgs.zabbly.com/incus/stable $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/zabbly-incus-stable.list
          sudo apt-get update && sudo apt-get install -y incus-client

          mkdir -p ~/.config/incus
          echo "$INCUS_CERT" > ~/.config/incus/client.crt
          echo "$INCUS_KEY" > ~/.config/incus/client.key
          chmod 600 ~/.config/incus/client.key

          incus remote add production "https://${INCUS_HOST}:8443" --accept-certificate --auth-type tls

      # 6. Ensure shared dir + .env exists
      - name: Ensure shared dir + .env exists
        run: |
          incus exec production:astro-prod -- mkdir -p /var/www/astro/shared
      
          echo "${{ secrets.ASTRO_ENV }}" > /tmp/astro.env
          incus file push /tmp/astro.env production:astro-prod/var/www/astro/shared/.env --mode=0640
          rm -f /tmp/astro.env


      # 7. Atomic Deploy into LXC Container
      - name: Atomic Deploy into LXC Container
        run: |
          RELEASE_ID=$(date +%Y%m%d%H%M%S)
          RELEASE_DIR="/var/www/astro/releases/$RELEASE_ID"

          echo "🚀 Creating Release: $RELEASE_DIR"
          incus exec production:astro-prod -- mkdir -p "$RELEASE_DIR"

          echo "📦 Pushing single Tarball to Container..."
          # Nur 1 Datei übertragen (dauert 1-2 Sekunden!):
          incus file push release.tar.gz "production:astro-prod/tmp/release-$RELEASE_ID.tar.gz"

          echo "📂 Extracting and Switching Symlink..."
          incus exec production:astro-prod -- sh -c "
            tar -xzf /tmp/release-$RELEASE_ID.tar.gz -C '$RELEASE_DIR' && \
            rm -f /tmp/release-$RELEASE_ID.tar.gz && \
            ln -snf /var/www/astro/shared/.env '$RELEASE_DIR/.env' && \
            ln -sfn '$RELEASE_DIR' /var/www/astro/current_tmp && \
            mv -Tf /var/www/astro/current_tmp /var/www/astro/current
          "

          echo "🔄 Restarting Astro SSR Service..."
          incus exec production:astro-prod -- systemctl restart astro

          echo "🧹 Cleaning Old Releases (Keep last 5)..."
          incus exec production:astro-prod -- sh -c "
            cd /var/www/astro/releases && ls -1t | tail -n +6 | xargs -r rm -rf
          "